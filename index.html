<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS FACEIT | PRO LEAGUE</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #5865F2;
            --accent: #00f2ff;
            --bg: #050508;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle at top, #1a1b2e 0%, var(--bg) 100%);
            color: #fff;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 1s ease;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(to bottom, #fff 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(88, 101, 242, 0.3);
        }

        .season-badge {
            display: inline-block;
            background: var(--primary);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .top-3 {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 25px;
            margin-bottom: 60px;
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            flex: 1;
            position: relative;
        }

        .card.gold { border-color: #ffd700; height: 220px; z-index: 2; transform: scale(1.05); }
        .card.silver { border-color: #c0c0c0; height: 180px; }
        .card.bronze { border-color: #cd7f32; height: 160px; }

        .card .rank-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
        .card .nick { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; display: block; }
        .card .elo { color: var(--accent); font-weight: bold; font-size: 1.5rem; }

        .search-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .search-container input {
            width: 100%;
            padding: 15px 25px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .search-container input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(88, 101, 242, 0.4); }

        .main-table-container {
            width: 100%;
            max-width: 1000px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(88, 101, 242, 0.1); padding: 20px; text-align: left; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: var(--primary); }
        td { padding: 18px 20px; border-bottom: 1px solid var(--border); font-size: 1rem; }
        tr:hover { background: rgba(255, 255, 255, 0.05); cursor: default; }

        .lvl-tag {
            background: linear-gradient(90deg, var(--primary), #8a94f8);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .top-3 { flex-direction: column; align-items: center; }
            .card { width: 100%; height: auto !important; transform: none !important; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PRO LEAGUE</h1>
        <div class="season-badge">СЕЗОН 1: МАЙ</div>
    </div>

    <div class="top-3" id="podium">
        <!-- JS вотрет данные -->
    </div>

    <div class="search-container">
        <input type="text" id="search" placeholder="Найти игрока по нику..." onkeyup="searchPlayer()">
    </div>

    <div class="main-table-container">
        <table>
            <thead>
                <tr>
                    <th># РАНГ</th>
                    <th>НИКНЕЙМ</th>
                    <th>ELO</th>
                    <th>LEVEL</th>
                    <th>KILLS</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script>
        function searchPlayer() {
            let filter = document.getElementById('search').value.toUpperCase();
            let rows = document.getElementById('table-body').getElementsByTagName('tr');
            for (let row of rows) {
                let nick = row.getElementsByTagName('td')[1].textContent.toUpperCase();
                row.style.display = nick.indexOf(filter) > -1 ? "" : "none";
            }
        }

        fetch('users.json')
            .then(res => res.json())
            .then(data => {
                const players = Object.values(data).sort((a, b) => b.elo - a.elo);
                
                // Тройка лидеров
                const podium = document.getElementById('podium');
                const top3 = players.slice(0, 3);
                const classes = ['gold', 'silver', 'bronze'];
                const medals = ['🥇', '🥈', '🥉'];

                top3.forEach((p, i) => {
                    podium.innerHTML += `
                        <div class="card ${classes[i]}">
                            <span class="rank-icon">${medals[i]}</span>
                            <span class="nick">${p.nickname}</span>
                            <span class="elo">${p.elo}</span>
                        </div>
                    `;
                });

                // Таблица
                const tbody = document.getElementById('table-body');
                players.forEach((p, i) => {
                    tbody.innerHTML += `
                        <tr>
                            <td style="color: #666; font-weight: bold;">${(i + 1).toString().padStart(2, '0')}</td>
                            <td style="font-weight: bold;">${p.nickname}</td>
                            <td style="color: var(--accent); font-weight: bold;">${p.elo}</td>
                            <td><span class="lvl-tag">LVL ${Math.floor(p.elo / 100) + 1}</span></td>
                            <td>${p.kills}</td>
                        </tr>
                    `;
                });
            })
            .catch(() => {
                document.querySelector('.main-table-container').innerHTML = "<div style='padding:40px; text-align:center;'>⚡ Ожидание данных... Пожалуйста, обновите страницу через минуту.</div>";
            });
    </script>
</body>
</html>
