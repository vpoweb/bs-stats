<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS FACEIT | PRO LEAGUE</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --primary: #5865F2; --accent: #00f2ff; --bg: #050508; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { font-family: 'Roboto', sans-serif; background: radial-gradient(circle at top, #1a1b2e 0%, var(--bg) 100%); color: #fff; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        
        /* ШАПКА */
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 8vw, 3.5rem); margin: 0; background: linear-gradient(to bottom, #fff 30%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .season-badge { display: inline-block; background: var(--primary); padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-top: 10px; letter-spacing: 2px; }

        /* ГЛОБАЛЬНАЯ ИНФО-ПАНЕЛЬ */
        .stats-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; margin-bottom: 40px; }
        .stat-card { background: var(--glass); border: 1px solid var(--border); padding: 20px; border-radius: 20px; text-align: center; backdrop-filter: blur(10px); }
        .stat-card span { display: block; font-size: 0.7rem; color: #666; text-transform: uppercase; margin-bottom: 5px; }
        .stat-card b { font-family: 'Orbitron'; font-size: 1.5rem; color: var(--accent); }

        /* ПЕРЕКЛЮЧАТЕЛЬ */
        .tab-container { display: flex; gap: 10px; margin-bottom: 30px; background: var(--glass); padding: 5px; border-radius: 30px; border: 1px solid var(--border); }
        .tab-btn { padding: 10px 25px; border-radius: 25px; border: none; background: transparent; color: #666; cursor: pointer; font-weight: bold; font-family: 'Orbitron'; font-size: 0.8rem; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 0 15px rgba(88, 101, 242, 0.4); }

        /* ПОДИУМ */
        .top-3 { display: flex; justify-content: center; align-items: flex-end; gap: 20px; margin-bottom: 50px; width: 100%; max-width: 900px; min-height: 250px; }
        .card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 20px; padding: 20px; text-align: center; flex: 1; cursor: pointer; position: relative; }
        .card:hover { transform: translateY(-10px); background: rgba(255,255,255,0.07); border-color: var(--primary); }
        .gold { border-color: #ffd700; height: 230px; transform: scale(1.08); z-index: 2; }
        .silver { border-color: #c0c0c0; height: 190px; }
        .bronze { border-color: #cd7f32; height: 170px; }

        /* ТАБЛИЦА */
        .main-table-container { width: 100%; max-width: 1000px; background: var(--glass); backdrop-filter: blur(15px); border-radius: 25px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(88, 101, 242, 0.1); padding: 18px; text-align: left; font-family: 'Orbitron', sans-serif; font-size: 0.65rem; color: var(--primary); }
        td { padding: 15px 20px; border-bottom: 1px solid var(--border); cursor: pointer; }
        tr:hover td { background: rgba(255, 255, 255, 0.05); color: var(--accent); }
        .lvl-tag { background: var(--primary); padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }

        /* МОДАЛКА */
        #modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(15px); z-index:1000; justify-content:center; align-items:center; padding:20px; }
        .modal-content { background:#16171d; border:1px solid var(--primary); width:100%; max-width:450px; border-radius:30px; padding:40px; position:relative; text-align:center; animation: scaleUp 0.3s ease; }
        @keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .stat-item { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px; border: 1px solid var(--border); }
        .stat-val { display: block; font-size: 1.2rem; font-family: 'Orbitron'; color: var(--accent); }

        @media (max-width: 768px) { .top-3 { flex-direction: column; align-items: center; } .card { width: 100%; height: auto !important; transform: none !important; } .stats-overview { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>PRO LEAGUE</h1>
        <div class="season-badge">SEASON 1: MAY</div>
    </div>

    <div class="stats-overview">
        <div class="stat-card"><span>Всего игроков</span><b id="total-players">0</b></div>
        <div class="stat-card"><span>Сыграно матчей</span><b id="total-matches">0</b></div>
        <div class="stat-card"><span>Всего киллов</span><b id="total-kills">0</b></div>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" onclick="changeTab('elo', this)">ПО ELO</button>
        <button class="tab-btn" onclick="changeTab('kills', this)">ПО КИЛЛАМ</button>
    </div>

    <div class="top-3" id="podium"></div>

    <div class="main-table-container">
        <table>
            <thead>
                <tr>
                    <th># РАНГ</th>
                    <th>ИГРОК</th>
                    <th id="th-sort">ELO</th>
                    <th>LEVEL</th>
                    <th>KILLS</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div id="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 id="m-nick" style="font-family: 'Orbitron'; color: var(--primary); margin: 0;"></h2>
            <p id="m-plt" style="color: #666; margin-bottom: 20px; font-size: 0.8rem;"></p>
            <div class="stat-grid" id="m-grid"></div>
        </div>
    </div>

    <script>
        let rawData = {};
        let currentSort = 'elo';

        async function loadData() {
            const res = await fetch('users.json');
            rawData = await res.json();
            updateDashboard();
            renderStats();
        }

        function updateDashboard() {
            const players = Object.values(rawData);
            document.getElementById('total-players').innerText = players.length;
            document.getElementById('total-matches').innerText = players.reduce((sum, p) => sum + (p.matches || 0), 0);
            document.getElementById('total-kills').innerText = players.reduce((sum, p) => sum + (p.kills || 0), 0);
        }

        function changeTab(type, btn) {
            currentSort = type;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('th-sort').innerText = type === 'elo' ? 'ELO' : 'КИЛЛЫ';
            renderStats();
        }

        function renderStats() {
            const players = Object.values(rawData).sort((a, b) => b[currentSort] - a[currentSort]);
            const podium = document.getElementById('podium');
            const tbody = document.getElementById('table-body');
            
            podium.innerHTML = '';
            tbody.innerHTML = '';

            // Топ-3
            const classes = ['gold', 'silver', 'bronze'];
            const medals = ['🥇', '🥈', '🥉'];
            players.slice(0, 3).forEach((p, i) => {
                podium.innerHTML += `
                    <div class="card ${classes[i]}" onclick="openModal('${p.nickname}')">
                        <span style="font-size: 2.5rem">${medals[i]}</span>
                        <span style="display:block; font-weight:bold; margin-top:10px;">${p.nickname}</span>
                        <span style="color:var(--accent); font-family:'Orbitron'; font-size:1.3rem;">${p[currentSort]}</span>
                    </div>`;
            });

            // Таблица
            players.forEach((p, i) => {
                tbody.innerHTML += `
                    <tr onclick="openModal('${p.nickname}')">
                        <td style="color:#444; font-weight:bold;">${(i + 1).toString().padStart(2, '0')}</td>
                        <td style="font-weight:bold;">${p.nickname}</td>
                        <td style="color:var(--accent); font-weight:bold;">${p[currentSort]}</td>
                        <td><span class="lvl-tag">LVL ${Math.floor(p.elo / 100) + 1}</span></td>
                        <td>${p.kills}</td>
                    </tr>`;
            });
        }

        function openModal(nick) {
            const p = Object.values(rawData).find(x => x.nickname === nick);
            document.getElementById('m-nick').innerText = p.nickname;
            document.getElementById('m-plt').innerText = `${p.platform || 'PC'} | РЕГИСТРАЦИЯ: ${p.reg_date || '---'}`;
            
            const kd = (p.kills / Math.max(1, p.deaths)).toFixed(2);
            const wr = p.matches > 0 ? ((p.wins / p.matches) * 100).toFixed(1) : 0;

            document.getElementById('m-grid').innerHTML = `
                <div class="stat-item"><span>Матчи</span><b class="stat-val">${p.matches}</b></div>
                <div class="stat-item"><span>ELO</span><b class="stat-val">${p.elo}</b></div>
                <div class="stat-item"><span>K/D</span><b class="stat-val">${kd}</b></div>
                <div class="stat-item"><span>Winrate</span><b class="stat-val">${wr}%</b></div>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        
        loadData();
    </script>
</body>
</html>
